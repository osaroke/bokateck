<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぼかてっく">
<meta name="theme-color" content="#121219" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f3f8" media="(prefers-color-scheme: light)">
<title>ぼかてっくノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: 3階層のノート帳。ホーム（3つの棚）→ 一覧（小分けタブ）→ 1件の中身。棚ごとに色が決まっていて、どこにいても色で分かる */
  :root {
    --bg: #121219;
    --surface: #1b1a25;
    --surface-2: #232231;
    --line: #2f2d40;
    --fg: #ecebf3;
    --sub: #a09db4;
    --faint: #6f6c84;
    --tech: #ff6aa8;
    --song: #6fd0f2;
    --trouble: #ff8a5c;
    --amber: #f2c26b;
    --amber-bg: #2a2416;
    --done: #5fd39a;
    --danger: #ff7d7d;
    --ink-on: #16121c;
    --display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 14px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f3f8; --surface: #ffffff; --surface-2: #f0edf5; --line: #e2dde9;
      --fg: #221f2c; --sub: #67637a; --faint: #9a96ab;
      --tech: #d42f78; --song: #1b7ea8; --trouble: #c4511f;
      --amber: #8f6210; --amber-bg: #fbf3e2; --done: #1d8a56; --danger: #c43a3a; --ink-on: #ffffff;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f3f8; --surface: #ffffff; --surface-2: #f0edf5; --line: #e2dde9;
    --fg: #221f2c; --sub: #67637a; --faint: #9a96ab;
    --tech: #d42f78; --song: #1b7ea8; --trouble: #c4511f;
    --amber: #8f6210; --amber-bg: #fbf3e2; --done: #1d8a56; --danger: #c43a3a; --ink-on: #ffffff;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg); color: var(--fg); font-family: var(--body);
    font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
    --c: var(--tech);
  }
  body[data-sec="song"] { --c: var(--song); }
  body[data-sec="trouble"] { --c: var(--trouble); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 680px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- 上の帯 ---------- */
  header.bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  header .wrap { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
  .row1 { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .back {
    flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); font-size: 18px; line-height: 1; display: grid; place-items: center;
  }
  .crumb { flex: 1; min-width: 0; }
  .crumb .app { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.2; margin: 0; }
  .crumb .app span { color: var(--tech); }
  .crumb .where { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.2; margin: 0; color: var(--c); }
  .crumb .path { font-size: 11px; color: var(--faint); font-family: var(--mono); letter-spacing: 0.04em; }
  .addbtn {
    flex: none; height: 36px; padding: 0 14px; border-radius: 10px; border: 0;
    background: var(--c); color: var(--ink-on); font-weight: 700; font-size: 14px;
  }
  #q {
    width: 100%; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); font-size: 16px;
  }
  #q::placeholder { color: var(--faint); }

  .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 5px 12px; border-radius: 999px; font-size: 12.5px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--surface); color: var(--sub);
  }
  .chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--ink-on); font-weight: 700; }
  .chip.mini { font-size: 11.5px; padding: 3px 10px; background: transparent; }
  .chip.mini[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  .chip .n { font-family: var(--mono); font-size: 10.5px; opacity: 0.75; margin-left: 4px; }

  main .wrap { padding-block: 14px 72px; }
  .status { font-size: 12px; color: var(--faint); text-align: center; margin-top: 26px; }

  /* ---------- ホーム ---------- */
  .shelves { display: flex; flex-direction: column; gap: 12px; }
  .shelf {
    --c: var(--tech);
    text-align: left; width: 100%; border: 1px solid var(--line); border-radius: 18px;
    background: var(--surface); padding: 16px 16px 14px; display: grid;
    grid-template-columns: 1fr auto; gap: 4px 12px; position: relative; overflow: hidden;
  }
  .shelf::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--c); }
  .shelf.song { --c: var(--song); }
  .shelf.trouble { --c: var(--trouble); }
  .shelf h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.25; color: var(--c); }
  .shelf .cnt { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--fg); align-self: start; font-variant-numeric: tabular-nums; }
  .shelf .cnt small { font-size: 11px; color: var(--faint); font-weight: 500; margin-left: 2px; }
  .shelf .what { grid-column: 1 / -1; font-size: 12.5px; color: var(--sub); margin: 0; }
  .shelf .latest { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 13px; }
  .shelf .latest span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .shelf .latest span::before { content: "・"; color: var(--c); }
  .shelf .alert { grid-column: 1 / -1; font-size: 12px; color: var(--trouble); font-weight: 700; }

  .home-h {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    color: var(--faint); margin: 26px 2px 10px; display: flex; align-items: center; gap: 10px;
  }
  .home-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* ---------- 一覧 ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    --c: var(--tech);
    width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; min-width: 0;
  }
  .item.song { --c: var(--song); }
  .item.trouble { --c: var(--trouble); }
  .item.is-done { opacity: 0.6; }
  .item .t { font-weight: 700; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
  .item .s { font-size: 12.5px; color: var(--sub); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .tag { font-size: 10.5px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--sub); }
  .tag.k { color: var(--c); }
  .tag.new { background: var(--c); color: var(--ink-on); font-weight: 700; }
  .tag.open { background: color-mix(in srgb, var(--trouble) 18%, transparent); color: var(--trouble); font-weight: 700; }
  .tag.ok { color: var(--done); }
  .tag.star { color: var(--amber); }
  .tag.mine { background: color-mix(in srgb, var(--song) 20%, transparent); color: var(--song); font-weight: 700; }
  .meta .d { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }

  .empty {
    text-align: center; color: var(--sub); font-size: 13.5px; padding: 40px 16px;
    border: 1px dashed var(--line); border-radius: var(--r);
  }
  .empty b { display: block; font-family: var(--display); font-weight: 400; color: var(--fg); font-size: 17px; margin-bottom: 6px; }

  /* ---------- 1件の中身 ---------- */
  .detail { display: flex; flex-direction: column; gap: 14px; }
  .detail h2 { margin: 0; font-size: 21px; line-height: 1.45; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
  .block { display: flex; flex-direction: column; gap: 4px; }
  .block .lab { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.12em; color: var(--faint); font-weight: 700; }
  .block .txt { font-size: 15px; white-space: pre-line; overflow-wrap: anywhere; }
  .block.fix .txt, .block.try .txt {
    background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 10px 12px; font-size: 14.5px;
  }
  .block.fix .txt { background: color-mix(in srgb, var(--done) 13%, transparent); color: var(--fg); }
  .block a { color: var(--c); overflow-wrap: anywhere; text-underline-offset: 3px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-width: 0; }
  .fact .lab { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--faint); font-weight: 700; }
  .fact .v { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .block.todo .txt { background: color-mix(in srgb, var(--song) 14%, transparent); border-radius: 10px; padding: 10px 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--line); }
  .act {
    font-size: 13px; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line);
    background: transparent; color: var(--sub);
  }
  .act[aria-pressed="true"].done { background: var(--done); border-color: var(--done); color: var(--bg); font-weight: 700; }
  .act[aria-pressed="true"].star { background: var(--amber); border-color: var(--amber); color: var(--bg); font-weight: 700; }
  .act.warn { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, var(--line)); }
  .act.push { margin-left: auto; }

  /* ---------- 書くシート ---------- */
  .sheet-back {
    position: fixed; inset: 0; z-index: 20; background: rgba(8, 7, 14, 0.55);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    width: 100%; max-width: 680px; max-height: 92%; overflow-y: auto;
    background: var(--surface); border-radius: 18px 18px 0 0; border: 1px solid var(--line);
    padding-block: 18px calc(18px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 12px;
  }
  .sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--c); }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--sub); }
  .field input, .field textarea, .field select {
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 80px; line-height: 1.6; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .songf { display: flex; flex-direction: column; gap: 12px; }
  .sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
  .btn.primary { background: var(--c); border-color: var(--c); color: var(--ink-on); }
  .formerr { color: var(--danger); font-size: 12.5px; min-height: 1em; margin: 0; }

  /* ---------- 同期パネル ---------- */
  .syncbox {
    margin-top: 30px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .syncbox h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 16px; color: var(--song); }
  .syncbox p { margin: 0; font-size: 12.5px; color: var(--sub); line-height: 1.75; }
  .syncbox .nums { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .syncbox .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .syncbox textarea {
    width: 100%; min-height: 110px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); resize: vertical;
  }
  .syncbox .ok { color: var(--done); font-size: 12.5px; min-height: 1em; }

  @media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <div class="row1">
      <button class="back" id="backBtn" type="button" aria-label="もどる" hidden>‹</button>
      <div class="crumb" id="crumb"></div>
      <button class="addbtn" id="addBtn" type="button" hidden>＋ 書く</button>
    </div>
    <input id="q" type="search" placeholder="ぜんぶから検索" autocomplete="off">
    <div class="strip" id="subStrip" role="group" aria-label="小分け" hidden></div>
    <div class="strip" id="flagStrip" role="group" aria-label="絞り込み" hidden></div>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="view"></div>
    <p class="status" id="status"></p>
  </div>
</main>

<div class="sheet-back" id="sheetBack" hidden>
  <form class="sheet" id="sheet" novalidate>
    <h2 id="sheetTitle">書く</h2>
    <div class="field" id="wSub"><label for="fSub" id="lSub">小分け</label><select id="fSub"></select></div>
    <div class="field"><label for="fTitle" id="lTitle">タイトル</label><input id="fTitle" maxlength="140"></div>
    <div class="field"><label for="fBody" id="lBody">内容</label><textarea id="fBody" rows="4"></textarea></div>
    <div class="field" id="wFix"><label for="fFix">どうやって直したか</label><textarea id="fFix" rows="4"></textarea></div>
    <div class="field" id="wStatus"><label for="fStatus">いまの状態</label>
      <select id="fStatus"><option value="solved">解決した</option><option value="open">まだ解決していない</option></select></div>
    <div id="wSong" class="songf">
      <div class="two">
        <div class="field"><label for="sDir">方向</label><select id="sDir"><option value="rock">ボカロック・ポップス</option><option value="edm">EDM・ダンス</option><option value="other">そのほか</option></select></div>
        <div class="field"><label for="sVoice">歌声（ボーカル）</label><input id="sVoice" placeholder="例：SynthV 夏色花梨"></div>
      </div>
      <div class="two">
        <div class="field"><label for="sBpm">BPM</label><input id="sBpm" inputmode="decimal" placeholder="128"></div>
        <div class="field"><label for="sKey">キー</label><input id="sKey" placeholder="Cm"></div>
      </div>
      <div class="field"><label for="sChords">コード進行・構成</label><textarea id="sChords" rows="2" placeholder="サビ：IV→V→iii→vi"></textarea></div>
      <div class="field"><label for="sGear">使用機材（楽器・ハード）</label><textarea id="sGear" rows="2" placeholder="Les Paul → Axe-Fx III（プリセット名）"></textarea></div>
      <div class="field"><label for="sPlugins">プラグイン・音源</label><textarea id="sPlugins" rows="3" placeholder="Serum 2（リード）、Superior Drummer 3、Pro-Q 3、soothe2…"></textarea></div>
      <div class="field"><label for="sMix">ミックス・音作りのメモ</label><textarea id="sMix" rows="3"></textarea></div>
      <div class="field"><label for="sTodo">次にやること</label><textarea id="sTodo" rows="2"></textarea></div>
      <div class="field"><label for="sDue">締切・応募先</label><input id="sDue" placeholder="例：ボカコレ秋 11/20"></div>
    </div>
    <div class="field" id="wTip"><label for="fTip">やってみる（Cubase や手持ちの機材で）</label><textarea id="fTip" rows="3"></textarea></div>
    <div class="two" id="wInstTags">
      <div class="field"><label for="fInst">楽器</label><select id="fInst"></select></div>
      <div class="field"><label for="fTags">タグ（、で区切る）</label><input id="fTags" placeholder="EQ、ボーカル"></div>
    </div>
    <div class="two" id="wSrc">
      <div class="field"><label for="fSrcLabel">出どころ</label><input id="fSrcLabel" placeholder="曲名・記事名など"></div>
      <div class="field"><label for="fSrcUrl">リンク</label><input id="fSrcUrl" type="url" placeholder="https://"></div>
    </div>
    <p class="formerr" id="formErr"></p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="cancelBtn">やめる</button>
      <button type="submit" class="btn primary" id="saveBtn">保存</button>
    </div>
  </form>
</div>

<script type="application/json" id="snapshot">{"built": "2026-11-05", "count": 91, "notes": [{"added": "2026-09-15", "body": "Aメロは楽器を絞ってボーカルの息遣いを聴かせ、サビで一気に楽器数と帯域を広げると音量を上げずに“サビ感”が出せる。ラウドネス競争に頼らない王道テクニック。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "arrange", "tags": ["構成", "ダイナミクス"], "tip": "Cubaseのミックスコンソールでセクションごとにチャンネル数をVCA/フォルダでグループ化しておくと、セクション単位のミュート比較がしやすい。", "title": "サビだけ「帯域を空ける」引き算アレンジ", "id": "arr-01"}, {"added": "2026-09-15", "body": "ボカロ曲はメロディが情報量多めになりがちなので、裏メロ(オブリガード)は歌が伸ばしている間や休符の瞬間だけ鳴らす。歌とぶつかると聴感上ゴチャつく最大要因になる。", "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "arrange", "tags": ["編曲", "ボーカル被り回避"], "tip": "ボーカルトラックをソロ再生しながら空白部分にロケーターを立て、その区間だけ裏メロを打ち込むと配置ミスが減る。", "title": "裏メロは歌の“隙間”にだけ配置", "id": "arr-02"}, {"added": "2026-09-15", "body": "キック・ハイハット・スネアを全パート鳴らし続けず、Bメロでハイハットだけ抜く、落ちサビでキックだけにするなど要素の抜き差しで展開感を演出する。音数を増やすより効果的な場合が多い。", "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "arrange", "tags": ["ドラム", "展開"], "tip": "ドラムエディター上でセクションごとにパートをミュートしたバリエーションをトラック複製で保存し、比較試聴する。", "title": "ドラムは“抜き差し”で展開を作る", "id": "arr-03"}, {"added": "2026-09-15", "body": "サビ直後の間奏で音量・音数を一気に落とすと次のBメロ/大サビへの“溜め”が作れる。落としすぎると失速するので、リズム隊は残すのがコツ。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "arrange", "tags": ["構成", "空間演出"], "tip": "間奏区間だけオートメーションでリバーブセンド量を上げると、空間的な“抜け感”が簡単に演出できる。", "title": "間奏はテンションを一段階だけ落とす", "id": "arr-04"}, {"added": "2026-09-19", "body": "ボカロ曲でよく使われる進行にはそれぞれ得意な雰囲気がある。感動・切なさ系は王道進行、安心感のあるポップさはカノン進行、疾走感とキャッチーさは小室進行、おしゃれ・都会的な質感は丸サ進行(オンコード多用)が向く。曲のテーマに合わせて土台を選ぶと方向性がブレにくい。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "arrange", "tags": ["コード進行", "作曲テンプレ"], "tip": "まず4〜8小節のループをコードトラックで組み、雰囲気を確認してからメロディを載せると手戻りが少ない。迷ったら王道進行か小室進行から始めるのが無難。", "title": "定番進行のテンプレを使い分ける", "id": "arr-05"}, {"added": "2026-10-17", "body": "Bメロ→サビ、ビルドアップ→ドロップのつなぎを、リズムパターンの変化、フィルターで帯域を絞る(音を消すだけでなく)、オートメーションで上昇感を足す、の3点で作る。実演は Ableton Live だが中身はDAWを問わない。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "Sleepfreaks（動画）", "url": "https://sleepfreaks-dtm.com/ableton-live-tips/b-sabi/"}, "star": false, "sub": "arrange", "tags": ["展開", "ビルドアップ", "オートメーション"], "tip": "Cubase ならサビ前2小節だけ、オケのバスにハイパスのオートメーションを書いて少しずつ開け、サビ頭で戻す。", "title": "サビ直前は「リズム・帯域・時間」の3つで盛り上げる", "id": "art-20261017-1"}, {"added": "2026-10-17", "body": "Faith Monaco の Serum 解説。エフェクトを足す前に、PWM・ベンド・デチューンで2層のベースの荒さを取っておく。プリセットは単体ではなく、808やスネアを鳴らしながら作る。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "Splice Blog", "url": "https://splice.com/blog/faith-monaco-serum-sound-design-tips/"}, "star": false, "sub": "sound", "tags": ["Serum 2", "ベース", "音作り"], "tip": "Serum 2 でベースを作るときは、ドラムのループを流しながら、FX ラックを全部オフにした状態で波形とデチューンから詰める。", "title": "シンセはエフェクトを積む前に元の音を整える", "id": "art-20261017-2"}, {"added": "2026-10-24", "body": "DECAP は Splice のインタビューで、グルーヴは耳で1音ずつ動かして作ると語っている。音ごとに置き場所は違うのでキックとシェイカーを同じ位置に置かない、スウィングを有効にしてそこで止めると「理屈っぽく」なる、グリッドから大きく外れていても当たりの強さが合っていれば成立する——という話。具体的な数値の指定はない。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "Splice Blog（英語）", "url": "https://splice.com/blog/decap-interview-art-of-the-pocket/"}, "star": false, "sub": "midi", "tags": ["グルーヴ", "タイミング", "ドラム", "打ち込み"], "tip": "Cubase 14 で Groove Agent や Addictive Drums 2 のループを一度 MIDI に落として、シェイカー・ハイハットだけを数ティック前後に動かして聴き比べる。クオンタイズのスウィング%を触る前にこれをやる。", "title": "キックとシェイカーを同じ位置に置かない。スウィングをオンにして終わりにしない", "id": "art-20261024-1"}, {"added": "2026-10-25", "body": "Sound On Sound 2026年10月号（Julian Rodgers）によると、リバーブはリードを奥に押しやってしまうので、代わりに100%ウェットの専用トラックにモノのディレイを立ててセンドで送る。リピートは3〜4回、4分音符でテンポ同期、極端に短い時間は避ける。フィードバック内でローパスをかけて繰り返しを暗くし、ローはハイパスで切って低中域の濁りを減らす。スラップバックは80〜150ms・同期なしが目安。", "checked": false, "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "article", "label": "Sound On Sound", "url": "https://www.soundonsound.com/techniques/six-practical-uses-delay"}, "star": false, "sub": "mix", "tags": ["ディレイ", "空間", "センド"], "tip": "Cubase で Replika XT か Comeback Kid を100%ウェットのFXトラックに立てて、ボーカルからセンドで送る。繰り返しのローは Pro-Q 3 で切る。テープ系の設定なら元から暗いので楽。", "title": "リードを「奥に下げずに大きく」したいならリバーブよりモノのディレイ", "id": "art-20261025-1"}, {"added": "2026-10-26", "body": "Sound On Sound「Mixing Toms」（2026年11月号）より。タムは近接マイクを普段より強めに使い、オーバーヘッドとルームを後から整える。近接マイクに乗るシンバルのかぶりは、マルチバンドのトランジェントデザイナー（記事では FabFilter Saturn）で高域のサステインを削って抑える。あとはハイパスとEQ、減衰が気になる打点には専用のゲート。タムはサンプル差し替えより生の音を作るほうが自然、という立場。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "Sound On Sound（英語・一部有料）", "url": "https://www.soundonsound.com/techniques/mixing-toms"}, "star": false, "sub": "mix", "tags": ["タム", "ドラムミックス", "トランジェント", "かぶり"], "tip": "Superior Drummer 3 のタムをパラアウトしたトラックに Transient Master を挿し、サステイン側を下げてみる。高域だけ狙うなら soothe2 か Pro-Q 3 のダイナミックEQで 5kHz 以上を動かす手もある。", "title": "タムは近接マイク主体で作り、シンバルのかぶりは高域のサステインだけ削る", "id": "art-20261026-1"}, {"added": "2026-10-26", "body": "Sound On Sound「Cubase: Loop Triggering With Groove Agent」（2026年11月号）より。16パッドを全選択→右クリック→Remove All Samples で空にし、Kit ページに2・4・8小節のループをパッドごとにドラッグ（プロジェクト窓・右ゾーンのメディア・OSのファイラーのどこからでも可）。落とす位置はパッドの中央。上下に落とすとスライスやレイヤー扱いになる。テンポは読み込み時に自動で合い、音程のある素材は Main と Pitch の Coarse でずらせる。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "Sound On Sound（英語・一部有料）", "url": "https://www.soundonsound.com/techniques/cubase-loop-triggering-groove-agent"}, "star": false, "sub": "cubase", "tags": ["Groove Agent", "ループ", "Cubase", "構成"], "tip": "Splice で落としたループを Groove Agent のパッドに並べておくと、鍵盤1つで差し替えながら構成を試せる。ワンショット（キック・シンバル・SE）を同じキットに混ぜておくのも記事の推奨。", "title": "Groove Agent SE をループ再生台にする（素材はパッドの中央に落とす）", "id": "art-20261026-2"}, {"added": "2026-10-27", "body": "Sound On Sound 2026年11月号（Alexander Wright）。リファレンス曲は較正の道具で、自分のミックスが良いかを判定する道具ではない、という整理。音量差があるだけで弱いミックスが良く聞こえるので「何より先にレベルを合わせる」。見るのは低域の伸びと制御・ボーカルの位置・音数・全体の帯域バランス。参考曲の良さの多くは作曲・演奏・録音・アレンジで決まっているので、ミックスで追いつこうとしないこと。そして「どこでやめるか」を先に決める。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "Sound On Sound", "url": "https://www.soundonsound.com/techniques/what-references-are-good"}, "star": false, "sub": "mix", "tags": ["リファレンス", "レベル合わせ", "帯域バランス"], "tip": "Cubase なら参考曲をプロジェクトに1本置いて、GainMatch か Tonal Balance Control 2 でレベルを揃えてから切り替える。比べる項目を低域・ボーカルの位置・音数の3つに決めて、それが済んだらやめる。", "title": "リファレンスと比べる前に、まず音量を揃える", "id": "art-20261027-1"}, {"added": "2026-11-01", "body": "Splice Blog（2026/8/7・Harrison Shimazu）が808ベースの鳴らし方を8種類に分けている。Static、Sustain conscience、Friendly neighbor、Chord follower、Ghost、Gliding、Reverse glide、808 etude の8つ。MIDIパターンとステムが zip で無料配布され、解説動画には型ごとのタイムスタンプが付いている。加工や音作りの手順は書かれていないので、型のカタログとして使う。", "checked": false, "done": false, "sec": "sample", "src": {"kind": "article", "label": "Splice Blog", "url": "https://splice.com/blog/8-levels-808s/"}, "star": false, "sub": "use", "tags": ["808", "ベース", "Splice", "EDM"], "tip": "zip を落として Cubase に並べ、同じコード進行のまま型だけ差し替えて聴き比べる。EDM のドロップ用のベースの引き出しにする。", "title": "808 の動かし方を8つの型で聴き比べる（MIDI・ステム無料配布）", "id": "art-20261101-1"}, {"added": "2026-11-02", "body": "Sound On Sound 2026年11月号の Aleksei Vasilev のコラム。サチュレーターをリバーブの後ろに置くと音全体が歪むだけだが、前に置くと残響が倍音を含んだ素材から作られ、部屋の鳴りではなく「質感」の音になるとしている。パッドは「サチュ→長いリバーブ」の順で、プリディレイを動かして距離感を変える。低中域を速く食うので、サチュ後の信号にハイパスをかけ、クリーンな音を下に残して重さを保つ。テープ系のエミュレーションはアタックを和らげるので、パッドの立ち上がりが角なく入るとのこと。高価なサチュレーターでも無料のものでも効果の性質は大きく変わらない、とも書いている。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "Sound On Sound", "url": "https://www.soundonsound.com/people/why-love-saturation-reverb"}, "star": false, "sub": "mix", "tags": ["ミックス", "リバーブ", "サチュレーション", "センド"], "tip": "Cubase で「サチュレーター→長めのリバーブ」の順に並べたリバーブ用の FX トラックを1本作り、パッドとギターをセンドで送ってみる。手持ちなら前段に RC-20 や TAIP、Super VHS、後段に Raum や Crystalline。サチュの後に Pro-Q 3 でハイパスを入れて、原音は下に残す。", "title": "サチュレーションはリバーブの前に置くと、残響そのものの質感が変わる", "id": "art-20261102-1"}, {"added": "2026-11-03", "body": "mizonote の記事によると、Spotify は -14 LUFS に合わせて再生音量を下げるので、数値を上げるより低域の重なりを減らすほうが効く。記事では Pro-C 3 と VolumeShaper を比べ、VolumeShaper のほうがピークを約2.9 dB 低く抑えられたとしている。ほかにステレオの広げ方（シンセとパッドは広げ、ボーカルとキックは中央）と、等ラウドネス曲線を意識した中高域の持ち上げを挙げている。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "mizonote", "url": "https://www.mizonote-m.com/whyothermixessoundbigger-big/"}, "star": false, "sub": "master", "tags": ["LUFS", "サイドチェイン", "低域", "マスタリング"], "tip": "Cubase のコンプをサイドチェインでキック→ベースに掛け、Ozone 11 で Integrated LUFS と True Peak を見ながら削る。低域は Basslane Pro でモノにまとめる。", "title": "音圧を上げるより、キックとベースのサイドチェインで低域のピークを削る", "id": "art-20261103-1"}, {"added": "2026-09-15", "body": "Aメロ・Bメロを順次進行(隣り合う音)中心にしておき、サビ頭だけ5度や6度の跳躍を入れると一気に開ける印象になる。ボカロ曲は音域が広く取れるので、人の声では出しにくい跳躍幅を使うのも武器になる。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "compose", "tags": ["メロディ", "構成"], "tip": "Cubaseのコードトラックでコード進行を先に置き、スコアエディタでメロディの音程差を目視確認すると跳躍の位置が調整しやすい。", "title": "サビ頭は「跳躍」で耳を掴む", "id": "comp-01"}, {"added": "2026-09-15", "body": "半音上げ/全音上げの安易な転調を避け、平行調やIVmを経由した転調にすると耳が疲れにくく、ボカロ曲特有の“劇伴っぽさ”が出せる。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "compose", "tags": ["転調", "構成"], "tip": "コードトラックの「コードアシスタント」で候補コードを試聴し、転調先のトニックへ自然につながる経由コードを探す。", "title": "転調は「サビ2回目」か「ラスサビ前」", "id": "comp-02"}, {"added": "2026-09-15", "body": "日本語詞は子音が少なく音符が詰まりやすい。16分の詰め込みパートと、母音を伸ばす“聴かせ”パートを意図的に交互配置すると、ボーカロイドでも滑舌が破綻しにくい。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "compose", "tags": ["作詞連携", "リズム"], "tip": "打ち込み前にキーエディタでラフに音価だけ並べ、歌詞を仮当てして詰まる箇所がないか先にチェックする。", "title": "歌詞の子音密度でメロディのリズムを決める", "id": "comp-03"}, {"added": "2026-09-15", "body": "日本人が好む哀愁メロは、ペンタトニックを基本にしつつ経過音として#4度やb6度を一瞬だけ通過させると効果的。使いすぎると民謡っぽくなるので1曲に1〜2箇所が目安。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "compose", "tags": ["メロディ", "スケール"], "tip": "該当音符だけベロシティを少し下げると“通過音感”が強まり浮かずに馴染む。", "title": "ペンタトニック逸脱で“エモさ”を作る", "id": "comp-04"}, {"added": "2026-09-19", "body": "人の生歌と違い、ボーカロイドはボイスバンクごとの得意音域に沿って作曲すれば正確に歌い切れる。目安はC3〜C5あたり。人間なら歌いにくい大きな跳躍もあえて使うことで“ボカロらしい”疾走感やキャッチーさが生まれる。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "compose", "tags": ["音域", "ボカロらしさ"], "tip": "サビだけオクターブを上げて最高音を置く、16分音符主体の早口フレーズを混ぜるなど、人の生歌では成立しにくい動きを積極的に試す。", "title": "ボカロの音域は「C3〜C5」を基準に組む", "id": "comp-05"}, {"added": "2026-10-18", "body": "SD3 の MIXER は、水色＝マイクの生信号（Kick In/Out/Sub）、黄色＝それを加工した結果（Kick Comp など）、赤＝メイン出力の3種類。しんろっく氏の解説では、生信号と加工済みを両方出すと音が二重になって濁るため、黄色の Kick Comp だけを別出力に回すのが良いとされている。全チャンネルをバラすと卸しが増えて混乱するだけ。手順は MIXER 左上のメニューから Apply Multichannel Outputs → Cubase 側の Inspector の矢印を開いて全出力を有効にする。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "shinrockmusic.com（しんろっく）", "url": "https://shinrockmusic.com/superior-drummer3-parallel-out-cubase/"}, "star": false, "sub": "mix", "tags": ["Superior Drummer 3", "パラアウト", "Cubase", "ドラムミックス"], "tip": "まずは Kick（Comp）・Snare（Comp）・Overheads（ステレオ）・Room（ステレオ）の4系統だけで立ち上げる。オーバーヘッドやルームをキックに混ぜると輪郭がぼやけるので別々のままにして、Pro-Q 3 と soothe2 は Kick Comp トラック単体に挿す。", "title": "Superior Drummer 3 のパラアウトは「黄色の加工済み」だけを出す", "id": "gear-20261018"}, {"added": "2026-10-19", "body": "mizonote の記事（Big Z の解説を日本語でまとめたもの）。コツは2つ。(1) オシレーターを使い分ける——片方に低域、もう片方に中高域を担当させる。(2) BUS を使い分ける——両方のルーティングを NONE にして BUS1・BUS2 へ 100% 送り、BUS1 は歪みで芯と重さを足し、BUS2 はコンプで粒を揃えたあとフィルターでアタックのクリックを削る。最後に MAIN で、両方に共通のコンプと、低中域だけ残すフィルターをかける。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "mizonote", "url": "https://www.mizonote-m.com/why-this-is-the-best-part-of-serum-2/"}, "star": false, "sub": "sound", "tags": ["Serum 2", "ベース", "EDM", "音作り"], "tip": "EDM 側のベースで試す。Serum 2 の中で2系統に分かれるので Cubase でトラックを分けずに済み、素の段階で帯域が整うぶん、あとから Pro-Q 3 や soothe2 で削る量が減る。", "title": "Serum 2 のベースはオシレーター2本＋BUS 2系統で組む", "id": "gear-20261019"}, {"added": "2026-10-20", "body": "mizonote の記事より。削りたい側（ベース）に soothe2 を挿し、サイドチェーン源にキックを選ぶ。ぶつかる 60Hz〜500Hz のグラフを持ち上げると、持ち上げた帯域ほど強く削られる。要らない 2kHz 以上はバンドを下げて対象から外し、depth で全体の強さを決める。soft／hard は hard のほうがキックもベースも輪郭が立つ、と書かれている。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "mizonote", "url": "https://www.mizonote-m.com/onesto-4-ways-soothe-2-helped-my-mix-git-gud/"}, "star": false, "sub": "mix", "tags": ["soothe2", "サイドチェーン", "低域", "ミックス"], "tip": "EDM 側のキック×ベースで試す。トラックプリセットに1つ作っておけば毎回の判断が消える。Pro-Q 3 のダイナミック EQ で帯域を探るより、削る形をグラフで描いて depth ひとつで加減できるぶん手が早い。", "title": "キックとベースの被りは soothe2 のサイドチェーンで 60〜500Hz だけ削る", "id": "gear-20261020"}, {"added": "2026-10-21", "body": "ミックスはピークが -3〜-6dBFS になるようWAVで書き出し、新しいオーディオトラックに読み込んで Ozone をフェーダー前に挿す。Master Assistant の結果はたたき台として扱い、直す→足すの順に、EQ は ±3dB 以内、Dynamics は 2〜3dB のゲインリダクション、Maximizer は Ceiling を -1.0dB True Peak にして -14 LUFS あたりへ。Short-term LUFS と True Peak の差が 6dB を切ったら潰れすぎのサイン。16bitに落とすときだけディザ、マスターは24bitで書き出す。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "tetsu7017（個人ブログ）", "url": "https://www.tetsu7017.com/blog/how-to-use-ozone-plug-in-in-mastering/"}, "star": false, "sub": "master", "tags": ["Ozone 11", "マスタリング", "LUFS", "トゥルーピーク"], "tip": "Cubase 14 で、ステレオアウトに挿さず一度書き出して別トラックに読み込む進め方がそのまま使える。Master Assistant の結果は自分のプリセットとして保存しておけば、曲ごとに走らせ直さなくて済む。EQ を ±3dB に収める判断は Tonal Balance Control 2 を並べて見ると早い。", "title": "Ozone は一度書き出して別トラックで。Master Assistant はたたき台まで", "id": "gear-20261021"}, {"added": "2026-10-22", "body": "Sleepfreaks の Pro-Q 3 新機能解説より。EQポイントを右クリックして Make Dynamic を選ぶと第2ハンドルが出て、その帯域の音量に応じて効き方が変わる。記事の例はマスターの7kHz付近を約5dB持ち上げ、スネアが来た瞬間だけ持ち上げ量が下がるようにして耳に痛いところを抑えるもの。かかっている量は黄色い線で見える。第2ハンドルをマイナスにすると逆（大きいときだけ削る）。しきい値は既定の Auto で試すのが勧められていて、解除は右クリックの Clear Dynamics。", "checked": false, "done": false, "inst": "guitar", "sec": "tech", "src": {"kind": "article", "label": "Sleepfreaks", "url": "https://sleepfreaks-dtm.com/mixing-plugin/fabfilter-pro-q-3-new-2/"}, "star": false, "sub": "mix", "tags": ["Pro-Q 3", "ダイナミックEQ", "住み分け"], "tip": "ギターとボーカルが取り合う3〜5kHz に、ギター側へダイナミックEQとして置く。歌が出ている瞬間だけ削れば、常時削ってギターが痩せるのを避けられる。マスターに使うなら7kHzでスネアの痛さ対策から。", "title": "Pro-Q 3 は「Make Dynamic」で、音が大きい瞬間だけ効くEQにできる", "id": "gear-20261022"}, {"added": "2026-10-23", "body": "Addictive Drums 2 を外部プラグインなしで生ドラムに寄せる手順。各ノブを Ctrl/Cmd クリックで初期化し、チャンネルごとに使うパラメータだけ残す。先に Master へ EQ と Tape を入れ、以降はそれを通した音で判断する。キックは Response の Filter 60%／Sample 85〜100% と Pitch Envelope、スネアは Volume Envelope の Release を約1.06秒に短縮。Room は Comp & Dist の Iron Transformer を 55%・Mix 100% で歪ませ、Bus のパラレルコンプを下から少しずつ混ぜる。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "SIMPLE STUDIO", "url": "https://simplestudio.jp/the-techniques/addictivedrums2-soundshaping/"}, "star": false, "sub": "sound", "tags": ["Addictive Drums 2", "ドラム", "音作り", "パラレルコンプ"], "tip": "ボカロックのドラムで、プリセット探しの前に「Master に EQ＋Tape → Room を Iron Transformer で歪ませる → Bus を下から上げる」の3手だけ試す。ここで芯と部屋鳴りが出れば、後段の Pro-Q 3 や soothe2 の作業が減る。", "title": "AD2 は Master に EQ＋Tape を先に入れてから作る", "id": "gear-20261023"}, {"added": "2026-10-24", "body": "Unmask は、立たせたいトラックが鳴ったときに相手側を引っ込める機能。サイドチェーンのダッキングと違い、音量を丸ごと下げずに衝突している帯域だけを下げるので、中域・高域の質感が残る。ぶつかっている帯域はプラグイン側が自動で見つけ、効き具合だけ手で詰める——と筆者（Croquette）が書いている。", "checked": false, "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "article", "label": "note（Croquetteギター機材研究）", "url": "https://note.com/croquette/n/n7689882fa8cf"}, "star": false, "sub": "mix", "tags": ["Neutron 4", "マスキング", "ボーカル", "サイドチェーン"], "tip": "Cubase 14 で Synthesizer V のメインが抜けないとき、ギターやパッド側の Neutron 4 に Unmask を立ててボーカルを基準にする。筆者の例は「バックに埋もれるボーカル」と「ギターとベースの間を埋めるエレピ・パッドが邪魔をする」ケース。", "title": "EQで削る前に、Neutron 4 の Unmask で被っている帯域だけ譲らせる", "id": "gear-20261024"}, {"added": "2026-10-25", "body": "mizonote の OTT 記事によると、不要な帯域のバンドをオフにして中域だけ圧縮し、DEPTH で混ぜる量を決めると、ボーカルとぶつかるギターの被りを解ける。TIME を右に回すとアタックとリリースが遅くなり、プラックや打楽器の芯が残る。DEPTH は効き具合＝前後感のつまみで、0 では何も起きない。比較するときは OUT GAIN でバイパス時と音量を揃えてから。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "mizonote", "url": "https://www.mizonote-m.com/7-tips-to-use-ott/"}, "star": false, "sub": "mix", "tags": ["OTT", "マスキング", "コンプ"], "tip": "ギターとボーカルがぶつかる所で、ギター側に OTT を挿して中域以外のバンドをオフ、DEPTH は低めから。EDM側はスーパーソウに TIME を右寄りで差すと、潰しても立ち上がりが残る。", "title": "OTT は「中域だけ潰す」でマスキング外しに使える", "id": "gear-20261025"}, {"added": "2026-10-26", "body": "mizonote の Spire コンプリートガイド #6 より。Spire はバンクとプリセットの読み書きをすべて MENU ボタンから行う。Splice で落としたプリセットは「Load Preset」で PC の Splice フォルダを直接たどって開く（Spire のプリセット一覧には出てこない）。GUI Options でスキンと表示倍率 100/150/200% を変更。MIDI Learn は learn を押す→パラメータをクリック→コントローラーを動かす、解除は learn を押してそのコントローラーを動かすだけ。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "mizonote（溝口）", "url": "https://www.mizonote-m.com/the-complete-guide-to-master-spire-6/"}, "star": false, "sub": "sound", "tags": ["Spire", "Splice", "プリセット", "MIDI Learn"], "tip": "EDM側のリード・プラックは、ゼロから音作りを始める前に Splice のプリセットから当たりを引く。MIDI Learn でカットオフを1つノブに割り当てておくと、ビルドアップの手弾きが速くなる。", "title": "Splice のプリセットは Spire の MENU「Load Preset」からフォルダを直に開く", "id": "gear-20261026"}, {"added": "2026-10-27", "body": "Sleepfreaks の Avenger 解説（全15章・各章に動画）。OSC の波形選択とユニゾン、FreeForm での波形描き、V-Saw でスーパーソウ、CHORDER で和音の重ね。Wavetable Editor は ENVELOPE・STRENGTH・SPEED で動かし、LFO の章で EDM のリードを作る。最後にドラムキットのパラアウトで CPU 負荷を下げる章がある。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "Sleepfreaks", "url": "https://sleepfreaks-dtm.com/softsynth/avenger_preset/"}, "star": false, "sub": "sound", "tags": ["Avenger", "スーパーソウ", "ウェーブテーブル", "パラアウト"], "tip": "EDM のリードはプリセット探しをやめて V-Saw ＋ Wavetable の ENV で1本作る。ドラムはパラアウトして Cubase のミキサー側で処理を分けると、Avenger 内で完結させるより後から直せる。", "title": "Avenger のリードは V-Saw と Wavetable の ENV で作る。ドラムはパラアウト", "id": "gear-20261027"}, {"added": "2026-10-28", "body": "Splice Blog で Bad Snacks と J3PO が自分の使い方を話している。Bad Snacks はリードに歪みとヒス寄りのウォブルを強めに当て、ローパスで角を落とす。鍵盤は「Vinyl 2」プリセットを下敷きに、思いきり広げてステレオのウォブルを少し足し、エレピ、とくにベルっぽい高い音に使う。J3PO は Magnitude のスライダーで SP-404 風の場面転換を作り、Distortion・Noise・Warble をトラックごとに薄く当てる。数値の設定は記事には書かれていない。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "Splice Blog", "url": "https://splice.com/blog/bad-snacks-j3po-rc-20-retro-color/"}, "star": false, "sub": "sound", "tags": ["RC-20", "質感づくり", "ロービット・テープ系"], "tip": "Cubase でエレピやシンセのトラックに個別に立てて Magnitude を浅めから。The Grandeur や Noire のベル寄りの音に Vinyl 2 を当てると、ボカロックの間奏で質感を切り替える手が増える。", "title": "RC-20 はマスターに1本ではなく、トラックごとに薄く当てる", "id": "gear-20261028"}, {"added": "2026-10-29", "body": "tetsu7017 のブログより。Groove Agent SE をインストゥルメントトラックに立てる → Pattern タブでジャンルとスタイルを選ぶ → 気に入ったパターンの▲マークを Cubase のトラックにドラッグ＆ドロップ → MIDIとして入るのでピアノロールで微調整、の4手順。MIDIファイルの読み込み手順とドラムマップ設定の注意も同じ記事にある。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "tetsu7017（個人ブログ）", "url": "https://www.tetsu7017.com/blog/cubase-drum-pattern-shortcut/"}, "star": false, "sub": "cubase", "tags": ["Groove Agent", "ドラム打ち込み", "時短"], "tip": "ボカロックの仮ドラムを1から置くのをやめて、近いパターンを落としてからキックとスネアのタイミングだけ直す。出来たMIDIは Superior Drummer 3 や Addictive Drums 2 に差し替えて鳴らせる。", "title": "ドラムは Groove Agent SE の Pattern から落として、あとで直す", "id": "gear-20261029"}, {"added": "2026-10-30", "body": "Trilian ではスライドやミュートは別サンプルなので、パッチを替えずに切り替えるには MULTI 画面の LIVE モードを使う。パートを右クリック →「MIDI Note Learn」で鍵盤の1音に割り当てる。STACK なら鍵盤の範囲・ベロシティ・CC ごとに別パッチを割り当てられる。パッチごとに個別アウトへ出してパラレル処理でき、重いときは THIN（ラウンドロビンとベロシティレイヤーの制限）で軽くできる。（DTMer.info・2019/8/3公開 2024/3/18更新・Trilian 1.5）", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "DTMer.info", "url": "https://dtmer.info/trilian/"}, "star": false, "sub": "midi", "tags": ["Trilian", "ベース", "キースイッチ", "パラアウト"], "tip": "ボカロックのベースで、スライドとミュートをキースイッチに割り当て、サビ前の1小節だけスライドを入れる。個別アウトに出して、ミュートのパートにだけ Pro-Q 3 と soothe2 を当て、ギターと喧嘩する帯だけ削る。", "title": "Trilian のスライドとミュートを鍵盤1音で切り替える", "id": "gear-20261030"}, {"added": "2026-10-31", "body": "note の「複数のKontakt音源をキースイッチで切り替えできるようにした話」（セカイル・2024/3/12）。キースイッチ非対応で奏法ごとに nki が分かれている音源への対処が3つ。(1) 使う nki を1ラックに読み込んで MIDI チャンネルを揃え、各 nki のグループ設定で指定の鍵盤を Start On Key にしてマルチ（nkm）で保存。(2) 空のバンク（nkb）に nki を入れ、FlexRouter スクリプトでキースイッチからプログラムチェンジを送る（スクリプトはバンクに保存されないので毎回呼び直し）。(3) 同じく nkb を作り、DAW のアーティキュレーションマップから各イベントでプログラムチェンジを送る。筆者は (3) が一番手軽と書いている。フル版の Kontakt が必要。記事にバージョン番号の記載はない。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "article", "label": "note（セカイル）", "url": "https://note.com/2ndillness/n/n66f141c31d19"}, "star": false, "sub": "midi", "tags": ["Kontakt", "キースイッチ", "エクスプレッションマップ"], "tip": "筆者は Cakewalk だが、Cubase にも同じ機能があると本文にある（エクスプレッションマップ）。奏法別に nki が分かれているストリングスやギター音源を、ボカロックのバッキング1トラックにまとめれば、トラックを行き来せずにスタッカートと伸ばしを書き分けられる。", "title": "奏法ごとに分かれた Kontakt 音源を、鍵盤1音で切り替えられるようにする", "id": "gear-20261031"}, {"added": "2026-11-01", "body": "Computer Music / MusicRadar の手順（2020/4/17）。Init パッチから、Performer 1 の右端ノードを上限（24）まで上げて8小節の上昇カーブを作り、Remote ページで Launch を Remote から Key に変えて鍵盤ごとに頭から走らせる。ウェーブテーブル Osc 1 を0にして Noise 1 を最大、Noise 1 のピッチを最低にしてから Performer 1 をピッチへ最大でルーティング。ノイズテーブルは Machines › Old、フィルターは Blue Monark、Amp のフィードバックを上げて最後の Stereo FX にステレオディレイを足す。Noise 2 の音量にも Performer 1 を当て、Static › Hiss でヒスを重ねる。最後に Performer 2 を1拍ループの上昇カーブにして Noise 1 の音量を揺らすと、サイドチェイン風のポンプが付く。", "checked": false, "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "article", "label": "Computer Music / MusicRadar", "url": "https://musicradar.com/how-to/how-to-create-a-pumping-riser-using-massive-xs-dual-noise-oscillators"}, "star": false, "sub": "sound", "tags": ["Massive X", "ライザー", "ビルドアップ", "EDM"], "tip": "一度作って自分のプリセットに保存しておけば、ビルドアップのたびに探さなくて済む。ボカロックでもサビ前1小節に薄く入れると落ちが強く聞こえる。", "title": "Massive X のノイズ2基でライザーを作り、1拍ループでポンプを付ける", "id": "gear-20261101"}, {"added": "2026-11-02", "body": "king tiptoe（リュウ）の BFD3 まとめ記事では、音色の読み込み（Presets／Kits／Drums）→シンバル・タムのチューニング→ダンピングとアーティキュレーション→アンビエントマイクの選別と送り量→Tweak 画面の Distance／Width→マイク間のブリード調整→スネアのレイヤーとエンベロープシェイパー→マルチアウト→バスコンプで確認、という順に手順が並ぶ。元は DAW LESSON 氏の動画（2019年版）のまとめなので、画面名は当時の版のもの。", "checked": false, "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "article", "label": "note / king tiptoe（リュウ）", "url": "https://note.com/kingtiptoe/n/ncad1e4bf004a"}, "star": false, "sub": "sound", "tags": ["BFD3", "ドラム", "アンビエント", "マルチアウト"], "tip": "Cubase で BFD3 をマルチアウトにして、アンビエント2本だけ別トラックに出す。送り量と Tweak の Distance で遠近を決めてから各マイクの音量を触る順にすると迷わない。ボカロックのドラムはここで決まる。", "title": "BFD3 の生っぽさは、アンビエントの送り量とブリードで決まる", "id": "gear-20261102"}, {"added": "2026-11-03", "body": "DTMer.info の解説では、Vocal Assistant のつまみは Shape＝EQ 2 のゲイン、Intensity＝Compressor 1 の複数パラメータ、FX の XY パッド＝Reverb・Delay・Dimension に対応するとされる。Target Library で歌声・ラップ・会話の基準カーブを選べ、Relearn で読み込みからやり直せる。Unmask は Amount（カットの強さ）・Dynamic・Sidechain の3つで帯域かぶりを削る。", "checked": false, "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "article", "label": "DTMer.info", "url": "https://dtmer.info/nectar3/"}, "star": false, "sub": "mix", "tags": ["Nectar 4", "ボーカル", "EQ", "コンプ"], "tip": "Synthesizer V Studio 2 や Piapro Studio から書き出したボーカルに Vocal Assistant を当て、Target Library を歌声に。あとは Shape と Intensity の2つだけで詰めると、モジュールを順に開けるより速い。", "title": "Nectar 4 は Vocal Assistant の Shape と Intensity だけで当たりを取る", "id": "gear-20261103"}, {"added": "2026-11-04", "body": "DTMer.info の MODO BASS 2 解説によると、CONTROL パネルで TYPE を選び VALUE にキースイッチか MIDI CC を割り当てる。LEGATO SLIDE はレガートで弾いたときにスライドが出る設定で、スライドの速さは次のノートのベロシティで決まる（強いほど速い）。PLAY STYLE（Finger／Pick／Slap）と FINGERING（First Position／Easy／Near）で左手の運指そのものが変わる。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "DTMer.info", "url": "https://dtmer.info/modo-bass/"}, "star": false, "sub": "midi", "tags": ["MODO BASS 2", "キースイッチ", "スライド", "打ち込み"], "tip": "ボカロックのベースは PLAY STYLE を Pick、弦を Round Wound・New にして立ち上がりを出す。サビ前のフィルだけ LEGATO SLIDE をキースイッチに割り当て、ベロシティでスライドの速さを付ける。付属の MIDI パターンはアーティキュレーションの入れ方の見本として読む。", "title": "MODO BASS 2 のスライドはキースイッチに置き、速さはベロシティで付ける", "id": "gear-20261104"}, {"added": "2026-11-05", "body": "DTMer.info の EZbass 解説より。Audio Tracker タブにオーディオを読み込み、Guitar／Bass／Percussive とテンポを指定するとMIDIを起こしてくれる。グリッドエディターで直してから「Add MIDI to Song Track」でトラックへ送る。キースイッチは D-1 人差し指／C#0 中指／E-1 ゴーストノート／F-1を押しながらF#0 でスライド／G#-1 タッピング／A#-1 ハーモニクス／B-1 スラップ／G#0 レガート。いま何が鳴っているかはピアノロールの一番下で確認できる。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "article", "label": "DTMer.info", "url": "https://dtmer.info/ezbass/"}, "star": false, "sub": "midi", "tags": ["EZbass", "ベース", "打ち込み", "キースイッチ"], "tip": "ボカロックでギターを先に作るタイプなら、そのオーディオからベースを起こしてルートの置き直しを省く。そのあと B-1 のスラップと E-1 のゴーストを数か所だけ足すと打ち込み臭さが取れる。EZbass 側のコードトラックに進行を入れておけば、転調しても一か所で直せる。", "title": "ギターのオーディオをEZbassのAudio Trackerに渡して、ベースの下敷きを作る", "id": "gear-20261105"}, {"added": "2026-09-15", "body": "配信サービスは概ね-14LUFS前後にラウドネスノーマライズされるため、それより極端に上げても実際の再生音量は変わらず音圧が潰れるだけになりがち。-14〜-9LUFS程度を目安に、曲の雰囲気に応じて調整する。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "master", "tags": ["ラウドネス", "LUFS"], "tip": "SuperVision などのラウドネスメーターでLUFS-Iを確認しながらリミッターの詰め具合を決める。", "title": "ラウドネスはストリーミング基準に合わせる", "id": "mast-01"}, {"added": "2026-09-15", "body": "自分の耳は長時間の作業で麻痺しやすい。近いジャンルの完成曲をマスタートラックに一時的に読み込み、音量を揃えた上でA/B切り替えしながら質感・帯域バランスを客観チェックする。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "master", "tags": ["リファレンス", "客観チェック"], "tip": "リファレンス曲もラウドネスメーターで数値を合わせてから聴き比べると、感覚だけに頼らない判断ができる。", "title": "リファレンス曲とのA/B比較を必ず行う", "id": "mast-02"}, {"added": "2026-09-15", "body": "スマホのスピーカーなど片方の耳/モノラル再生環境で聴かれることも多い。ステレオイメージを広げすぎた楽器がモノラルで位相干渉を起こし薄くなっていないか確認する。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "master", "tags": ["モノラル互換", "位相"], "tip": "マスターチャンネルに一時的にモノ変換のユーティリティを挿し、ステレオ/モノを切り替えて聴き比べる。", "title": "モノラル互換を必ず確認する", "id": "mast-03"}, {"added": "2026-09-15", "body": "打ち込みが機械的に聴こえる最大要因はベロシティの均一さ。フレーズの山(強調したい音)に向けて緩やかに強弱の波を作ると生演奏らしさが出る。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "midi", "tags": ["ヒューマナイズ", "ベロシティ"], "tip": "MIDIエディタの「ロジカルエディタ」でランダマイズ+手動修正を組み合わせると時短しつつ不自然さを回避できる。", "title": "ベロシティに“波”を作ってヒューマナイズ", "id": "midi-01"}, {"added": "2026-09-15", "body": "100%クオンタイズは音楽的なゆらぎを消してしまう。Cubaseのクオンタイズストレングス(強さ)を50〜80%程度に設定すると、グリッドに寄せつつ人間味を残せる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "midi", "tags": ["クオンタイズ", "MIDI設定"], "tip": "プリファレンス > MIDI で「クオンタイズ後もイテレイト」を有効にすると、演奏後も継続的に補正がかかり微調整が楽。", "title": "クオンタイズは“強さ”を弱めにかける", "id": "midi-02"}, {"added": "2026-09-15", "body": "ドラムやベースに、意図的に聴こえるか聴こえないかの弱音(ゴーストノート)を挟むとグルーヴに厚みが出る。特にスネアの合間やベースの16分の裏に有効。", "done": false, "inst": "drums", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "midi", "tags": ["グルーヴ", "ドラム", "ベース"], "tip": "ベロシティを20〜35程度に固定したノートをコピー&ペーストで挟み込み、まとめて微調整すると効率的。", "title": "ゴーストノートでグルーヴを底上げ", "id": "midi-03"}, {"added": "2026-09-15", "body": "先にコードトラックでコード進行を確定させておくと、後からベース・ピアノ・ストリングスをコードに追従させて自動生成でき、転調や進行変更にも一括対応できる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "midi", "tags": ["コードトラック", "効率化"], "tip": "「コードイベントをMIDIトラックに変換」機能で仮アレンジを一気に作り、そこから手を入れると初動が速い。", "title": "コードトラックでアレンジ全体を一括管理", "id": "midi-04"}, {"added": "2026-09-15", "body": "VOCALOIDをオーディオ化してVariAudioで微修正する際、セグメントを完全に一直線にすると不自然になりやすい。ピッチカーブを少し残す(補正強度を100%にしない)のがコツ。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["VariAudio", "ピッチ補正"], "tip": "セグメントを選択してから「ピッチを平坦化」のスライダーを70〜85%程度に留めると自然な揺らぎが残る。", "title": "VariAudioで“ケロらせすぎ”を防ぐピッチ補正", "id": "mix-01"}, {"added": "2026-09-15", "body": "まず200〜400Hz付近のこもりや、3〜5kHzの刺さりを削り、その後で高域の艶(8kHz以上)を軽くブーストすると輪郭がクリアになる。足し算だけのEQは濁りの原因になりやすい。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["EQ", "ボーカル"], "tip": "CubaseのフリーEQ(旧Frequency 2)でハイパスを80〜100Hz付近から緩やかにかけ、不要な低域を先に整理してから中高域を追い込む。", "title": "ボーカルEQは“削ってから足す”", "id": "mix-02"}, {"added": "2026-09-15", "body": "キックとベースが同じ低域で喧嘩すると輪郭がぼやける。ベースにキックをトリガーにした軽いサイドチェインコンプをかけると、キックの度に一瞬ベースが凹み、両方の存在感が両立する。", "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["サイドチェイン", "ベース", "キック"], "tip": "CubaseのCompressor(VSTダイナミクス)のサイドチェイン入力にキックトラックをルーティングし、レシオ2:1程度・浅めのかかりから始める。", "title": "サイドチェインでキックとベースの帯域を住み分け", "id": "mix-03"}, {"added": "2026-09-15", "body": "各トラックに個別リバーブを挿すと空間がバラバラになりがち。共通のリバーブをFXチャンネルに立てて各トラックからセンドする方式にすると、一つの部屋で鳴っているような一体感が出る。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["リバーブ", "空間系"], "tip": "ショートリバーブ(質感用)とロングリバーブ(空間用)の2系統をFXチャンネルとして用意し、楽器ごとにセンド量の配分を変える。", "title": "リバーブは“Send”で空間を統一する", "id": "mix-04"}, {"added": "2026-09-15", "body": "1〜4kHz帯はボーカルの明瞭度に直結する帯域。ギターやシンセがここで被っていると歌が埋もれる。オケ側のこの帯域を数dB削るだけでボーカルの抜けが劇的に改善することが多い。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["帯域整理", "ボーカル抜け"], "tip": "オケだけソロ再生した状態でアナライザーを見て、ボーカルの帯域と重なるピークを探し、そこをピンポイントでカットする。", "title": "ボーカルとオケの棲み分けはミッドレンジで決まる", "id": "mix-05"}, {"added": "2026-09-19", "body": "ボーカルとシンセ・ギターが同じ帯域で常に喧嘩していると、フェーダーだけでは調整しきれないことが多い。ダイナミックEQをシンセ/ギター側に挿し、ボーカルの信号をサイドチェイン入力にすると、歌が鳴っている瞬間だけ被る帯域が自動で少し凹み、常にボーカルの通り道が確保される。", "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["ダイナミックEQ", "サイドチェイン", "帯域整理"], "tip": "通常のサイドチェインコンプ(帯域全体を下げる)と違い、ぶつかっている周波数帯だけをピンポイントで下げられるのが利点。ボーカルの主要帯域(1〜4kHz付近)を中心に設定する。", "title": "ダイナミックEQでシンセ/ギターをボーカルに自動でダッキング", "id": "mix-06"}, {"added": "2026-10-17", "body": "Daft Punk「Get Lucky」では、Nile Rodgers のギターは2本のパートでできていて、ミックスの Mick Guzauski が手を入れたのは卓のEQで5k付近を持ち上げた程度。ベースの Nathan East は、ギターが乗って曲の感じが変わったため約半年後にベースを録り直し、ギターのリズムに噛み合わせたと語っている。", "checked": false, "done": false, "inst": "guitar", "sec": "tech", "src": {"kind": "song", "label": "Get Lucky / Daft Punk", "url": "https://www.youtube.com/watch?v=5NV6Rdv1a3I"}, "star": false, "sub": "arrange", "tags": ["カッティング", "ギター", "ベース", "グルーヴ"], "tip": "Axe-Fx で録ったカッティングは、高域を少し持ち上げるだけに留めてどこまで素で抜けるか試す。打ち込みベース(EZbass や MODO BASS 2)は、ギターを録ったあとに16分の位置をギターに合わせて打ち直す。", "title": "カッティングは「加工で太く」より「役割の違う2本」で", "id": "song-20261017"}, {"added": "2026-10-18", "body": "Chinozo はインタビューで、かわいい雰囲気の曲でもギターは“かわいい”ではなく“かっこいい”方向で鳴らし、かわいさはシンセ側で出していると話している。自分の音を「バンドのロックとエレクトロの中間」と位置づけ、暗さの基準値を先に決めてから明るさを足していく作り方。ギターは全曲 Fender ストラトキャスター。歌はビブラートをあえて抑えて幼い質感にしているとのこと。", "checked": false, "done": false, "inst": "general", "sec": "tech", "src": {"kind": "song", "label": "グッバイ宣言 / Chinozo feat. flower", "url": "https://plugplus.rittor-music.co.jp/learning/interview/vocalockmania1_chinozo/"}, "star": false, "sub": "arrange", "tags": ["ボカロック", "アレンジ", "音色の役割分担", "Chinozo"], "tip": "Cubase で、ギターは歪みとカッティングで硬さ側に固定したまま、同じフレーズを Serum 2 のプラックで重ねずに別パートとして“かわいい”側を担当させる。歌は Synthesizer V Studio 2 のビブラート量を一度ゼロ近くまで落として、どこまで幼く聞こえるか試す。", "title": "明るい曲でも楽器ごとに担当を割る（ギターは硬く、かわいさはシンセで）", "id": "song-20261018"}, {"added": "2026-10-19", "body": "Porter Robinson は『Nurture』で、ピッチを上げた自分の声を主役にしている（本人は「デジタル・ファルセット」と呼び、自然な声では成立しないメロディや歌詞がこのレンジだと成立する、と説明）。作り方について、メロディの下書きにはボカロ（初音ミク）・ピアノ・ソーウェーブを使い、歌は30分ほどマイクに向かって即興で歌う／ささやく／叫ぶを録り、良いテイクを切り刻んでメロディを組むと話している（Audacy のインタビュー）。", "checked": false, "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "song", "label": "Look at the Sky / Porter Robinson", "url": "https://www.youtube.com/watch?v=TJBh_hj6DzE"}, "star": false, "sub": "compose", "tags": ["メロディ", "ボカロ", "仮歌", "ボーカル"], "tip": "ボカロを「完成品の歌い手」ではなく下書き用の定規として使う。Piapro Studio か Synthesizer V Studio 2 に先にメロディを歌わせてキーと音域を決め、そのあと Cubase でサイクル録音を30分回して自分の仮歌を録り、切り貼りで本線を作る。", "title": "メロディの下書きにボカロを使い、歌は即興30分から切り刻む", "id": "song-20261019"}, {"added": "2026-10-20", "body": "Nirvana「Smells Like Teen Spirit」のプロデューサー Butch Vig は「ダブリングが好きで、とくにサビで使う」と語り、カート・コバーンはアルバム全体でリズムギターを何本も重ねたと述べている（Sound On Sound のインタビュー）。Aメロの揺れたクリーンは Electro-Harmonix Small Clone のコーラス。ボーカルは Neumann U67 と LA-2A でテープに直録りし、ほぼドライのまま、コンプで振れ幅だけを抑えたとのこと。", "checked": false, "done": false, "inst": "guitar", "sec": "tech", "src": {"kind": "song", "label": "Smells Like Teen Spirit / Nirvana", "url": "https://www.youtube.com/watch?v=hTWKbfoikeg"}, "star": false, "sub": "arrange", "tags": ["ダブリング", "ギター", "サビ", "ボカロック"], "tip": "Choral でAメロのクリーンに揺れを足す。サビのリズムギターは同じフレーズを2回録って（打ち込みならタイミングとベロシティを少しずらした2本にして）L/R に振る。ボーカルはドライのまま、コンプで粒を揃えるだけに留めるとギターの壁と喧嘩しない。", "title": "サビの爆発は歪みを足すより、同じギターを2本重ねて左右に振る", "id": "song-20261020"}, {"added": "2026-10-21", "body": "bad guy のベースは subbass1・subbass2 の2本で、フック部分だけ歪ませた dirtybass がそこへ重なる。ミックスした Rob Kinelski は Sound On Sound の解説で、サブのバスは SSL Channel Strip で800Hzを持ち上げて400Hzを削り、そのうえで6:1のコンプ、さらにキックへ軽くサイドチェーンした Renaissance Compressor（20:1）を通していると話している。ボーカルはリード・ダブル・ハモり・コーラスの4グループが同じチェーンを共有し、EQだけグループごとに変えている。ピッチ補正・タイミング補正はかけていない。", "checked": false, "done": false, "inst": "bass", "sec": "tech", "src": {"kind": "song", "label": "bad guy / Billie Eilish", "url": "https://www.soundonsound.com/techniques/inside-track-billie-eilish-bad-guy"}, "star": false, "sub": "sound", "tags": ["サブベース", "レイヤー", "EQ", "サイドチェーン"], "tip": "Serum 2 でサイン波のサブを1本、同じMIDIでノコギリ波をもう1本鳴らして FIRETHECLIP か TAIP で歪ませ、Pro-Q 3 で 800Hz を少し持ち上げ・400Hz を削る。歌側は Synthesizer V のダブルとハモりを Cubase のグループチャンネルにまとめ、チェーンは1本にして EQ だけ変える。", "title": "サブベースは触らず、歪ませた別レイヤーの800Hzで聞こえるようにする", "id": "song-20261021"}, {"added": "2026-10-22", "body": "Shaboozey「A Bar Song (Tipsy)」の顔になっているフィドルの旋律は、もとは Splice のフィドルループを刻んで作り直したもの。そこへ生のフィドル奏者が主旋とフィルを弾き、ループと混ぜている、とプロデューサーの Sean Cook・Nevin Sastry が Sound On Sound で話している。約30本重ねたアコギを成立させたのは「ストロークのタイミングを揃えること」だったとも語られている。", "checked": false, "done": false, "sec": "sample", "src": {"kind": "song", "label": "A Bar Song (Tipsy) / Shaboozey", "url": "https://www.soundonsound.com/techniques/inside-track-shaboozey-bar-song-tipsy"}, "star": false, "sub": "use", "tags": ["Splice", "ループ", "重ね", "アコギ"], "tip": "Splice のループをそのまま敷かず、刻んで骨組みにしてから、Ample Guitar か Session Guitarist Strummed Acoustic で同じ旋律を弾き直して重ねる。ループ側は Pro-Q 3 で中域を削って生側に居場所を作る。重ねる本数より、ストロークの位置を揃えるほうが効く。", "title": "Splice のループは「敷く」より、刻んで骨組みにして同じ旋律を別の音で重ねる", "id": "song-20261022"}, {"added": "2026-10-23", "body": "Avicii「Wake Me Up」は、Incubus の Mike Einziger が弾いたアコギのリフが核。アコースティック版を1セッションで作り上げ、Avicii がそのあと数日かけてダンス・ミックスに仕立てた、とされる。進行は Bm/G/D/A、124 BPM・Bマイナー。Einziger 本人はこのリフをペンタトニックのフレーズと語り、ブルーグラス的なストロークは自分の普段のアルペジオとは「まるで別世界」とインタビューで話している。", "checked": false, "done": false, "inst": "guitar", "sec": "tech", "src": {"kind": "song", "label": "Wake Me Up / Avicii", "url": "https://www.guitarworld.com/features/incubus-mike-einziger-avicii-wake-me-up"}, "star": false, "sub": "arrange", "tags": ["アレンジ", "アコギ", "EDM", "デモ"], "tip": "Cubase で Bm/G/D/A を Ample Guitar か Session Guitarist Strummed Acoustic のストロークだけで1コーラス通す。それが曲として聴けたら、Serum 2 のプラックとキックを後載せする順番にしてみる。", "title": "EDMは後載せ。まず生楽器だけで成立するデモを完成させる", "id": "song-20261023"}, {"added": "2026-10-24", "body": "Marvin Gaye「What's Going On」のリードが2本重なって聞こえるのは、もともと聴き比べ用に録った2テイク。本人は別々のテープで欲しがったが、エンジニアの
