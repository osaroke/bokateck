, "url": ""}, "star": false, "sub": "cubase", "tags": ["テンプレート", "効率化"], "tip": "「ファイル > テンプレートとして保存」でプロジェクト全体を保存しておき、新規プロジェクト作成時に呼び出す。", "title": "テンプレートプロジェクトで初動を高速化", "id": "work-01"}, {"added": "2026-09-15", "body": "デフォルトのショートカットを全部覚える必要はない。分割・ミュート・クオンタイズなど自分が1日に何度も使う操作だけ、押しやすいキーに割り当て直すと作業速度が体感で変わる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "cubase", "tags": ["ショートカット", "設定"], "tip": "「キーコマンド」設定画面で自分がよく使う機能を検索し、片手で押せる位置(Z, X, C周辺など)に集約する。", "title": "キーコマンドはよく使う操作だけ絞ってカスタム", "id": "work-02"}, {"added": "2026-09-15", "body": "「全トラックのベロシティを一律で下げる」「特定音程だけ抽出して確認する」など、手作業だと時間のかかる修正をロジカルエディタのフィルタ+アクション設定で一括処理できる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "cubase", "tags": ["ロジカルエディタ", "一括処理"], "tip": "よく使うフィルタ条件はプリセットとして保存しておき、次回以降ワンクリックで呼び出せるようにする。", "title": "プロジェクトロジカルエディタで一括修正", "id": "work-03"}, {"added": "2026-09-15", "body": "ステム書き出し・ラフミックス書き出しなど用途別に書き出し設定(サンプルレート・ビット深度・範囲)をプリセット保存しておくと、書き出しミスや設定し忘れを防げる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "cubase", "tags": ["書き出し", "ミスの防止"], "tip": "「ファイル > 書き出し > オーディオミックスダウン」の設定画面下部でプリセットを保存し、用途ごとに名前を分けておく。", "title": "書き出し設定はプリセット化して確認漏れを防止", "id": "work-04"}, {"added": "2026-09-19", "body": "完成した歌声トラックをスライス系のサンプラー機能に読み込み、任意のタイミングで細かく分割すると、各断片が自動でパッドやMIDIノートに割り当てられる。分割した歌声の断片をリズムに合わせて再配置すれば、独特なボーカルチョップの効果音やフレーズが作れる。", "done": false, "inst": "vocal", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "sound", "tags": ["ボーカルチョップ", "サンプラー活用"], "tip": "Aメロなどの静かな場面転換や、落ちサビ明けのアクセントとして短く挟むと効果的。やりすぎると聴き取りづらくなるので使用箇所は絞る。", "title": "サンプラー機能でボーカルチョップを作る", "id": "work-05"}, {"added": "2026-09-19", "body": "和風・和楽器系のフレーズを打ち込む際、ピアノロール上でキーとスケールを指定すると、そのスケールから外れる音の背景色が変わり、外れ音を避けながら旋律を組みやすくなる。都節音階や琉球音階など、通常のメジャー/マイナー以外の音階も自作して登録できる。", "done": false, "inst": "synth", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "midi", "tags": ["スケール設定", "和楽器"], "tip": "和楽器音源を使うパートだけこの機能を有効にしておくと、洋楽器パートとの打ち込みを行き来しても音階の混同を防げる。", "title": "和楽器フレーズ用にスケールをカスタム設定する", "id": "work-06"}, {"added": "2026-09-19", "body": "左右チャンネルで異なるディレイタイムを設定する(例: 左を短め・右をその倍程度)と、単純なモノラルディレイよりも自然な広がりと心地よさが生まれる。かけすぎず“薄く”常時かけっぱなしにする使い方が特に効果的。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "mix", "tags": ["ディレイ", "空間系"], "tip": "ボーカルやリードシンセのセンド用FXチャンネルとして常設しておき、曲全体に一貫した空間の質感を持たせる。", "title": "左右で長さの違うステレオディレイを薄くかける", "id": "work-07"}, {"added": "2026-09-20", "body": "矢印キーでのトラック移動は、選択中のイベントの有無によって次に選択されるトラックの挙動が変わる仕様になっている。そのため空白のトラックが挟まっていると、読み飛ばされているように感じることがある。", "fix": "「環境設定」→「編集操作」→「上下の矢印キーをトラックの選択だけに使う(パートには使わない)」をオンにすると、矢印キーが純粋なトラック選択専用になり、空白トラックも含めて並び順通り1つずつ移動するようになる。", "sec": "trouble", "src": {"kind": "memo", "label": "トラブル解決メモ", "url": ""}, "star": false, "status": "solved", "sub": "cubase", "tags": ["トラック選択", "ショートカット"], "title": "上下矢印キーでのトラック選択、空白トラックが飛ばされる問題", "id": "work-08"}, {"added": "2026-09-20", "body": "アップデートを機にエディター関連の環境設定がリセットされ、これまで別ウィンドウで開いていたキーエディターやサンプルエディターが、プロジェクトウィンドウ下部の「下ゾーン」に開くようになることがある。", "fix": "「環境設定」→「エディター」内にある、ダブルクリック時の開き方に関する項目を見直す。UI言語が英語表示に切り替わっている場合は項目名も英語表記になるため注意。", "sec": "trouble", "src": {"kind": "memo", "label": "トラブル解決メモ", "url": ""}, "star": false, "status": "solved", "sub": "cubase", "tags": ["エディター", "環境設定"], "title": "アップデート後にエディターが下ゾーンで開くようになった", "id": "work-09"}, {"added": "2026-09-20", "body": "アップデート後にツールバーの表示設定がリセットされ、ノートの色分け基準(ベロシティ/トラックカラーなど)を選ぶ「カラー」メニューがツールバーから消えてしまうことがある。", "fix": "キーエディターのツールバー上、何もないところで右クリックし、表示されたメニューから「カラー」項目にチェックを入れると、ツールバーにカラーメニューが復活する。", "sec": "trouble", "src": {"kind": "memo", "label": "トラブル解決メモ", "url": ""}, "star": false, "status": "solved", "sub": "cubase", "tags": ["カラー設定", "ツールバー"], "title": "キーエディターのカラーメニューが表示されない", "id": "work-10"}, {"added": "2026-09-20", "body": "キーエディターのカラーメニューから、ノートの色分け基準を切り替えられる。ベロシティ基準にすると強弱が視覚的に把握しやすく、トラックカラー基準にすると見た目の気分転換になる。", "done": false, "inst": "general", "sec": "tech", "src": {"kind": "memo", "label": "初期ノート", "url": ""}, "star": false, "sub": "cubase", "tags": ["ノートカラー", "ベロシティ"], "tip": "普段の打ち込み作業はベロシティ表示、仕上げ間近など気分を上げたい時はトラックカラー表示、というように用途で切り替えるのがおすすめ。", "title": "MIDIノートの色をベロシティ/トラックカラーで使い分ける", "id": "work-11"}, {"added": "2026-09-20", "body": "Cubase 15では、デフォルト状態でツールバー上の「クオンタイズプリセット」が折りたたまれて隠れている。メインのプロジェクトウィンドウ、キーエディターのどちらのツールバーでも同様に起こる。", "fix": "ツールバー上にある、縦に並んだ小さいドット(折りたたみアイコン)をクリックすると、隠れていたクオンタイズプリセットの数値が展開されて表示される。", "sec": "trouble", "src": {"kind": "memo", "label": "トラブル解決メモ", "url": ""}, "star": false, "status": "solved", "sub": "cubase", "tags": ["クオンタイズ", "Cubase 15"], "title": "クオンタイズプリセット(1/16など)が見当たらない", "id": "work-12"}, {"added": "2026-09-20", "body": "「Loading samples failed. Plug-in will not make sound.」は、プラグインがサンプルライブラリを読み込めていないという意味のエラー。フォルダの移動、再インストール、環境の変更のあとに出ることがある。", "fix": "プラグイン上部の歯車アイコンから設定を開き、Instrument Path(サンプルの保存場所)を確認する。分からない場合は、エクスプローラーで拡張子「.ascf」を検索するとサンプルの場所が分かる。それでも直らなければ、完全版インストーラーを再ダウンロードして再インストールする。※前回は、パスが「None」表示のまま、いつの間にか復旧した(原因は未特定)。", "sec": "trouble", "src": {"kind": "memo", "label": "トラブル解決メモ", "url": ""}, "star": false, "status": "solved", "sub": "plugin", "tags": ["Ample Guitar", "エラー"], "title": "Ample Guitarで「Loading samples failed」が出て音が鳴らない", "id": "work-13"}]}</script>

<script>
(function () {
  "use strict";

  /* =========================================================================
     iPhone版（GitHub Pages）。
     読み込み元は2つ:
       SNAP  … このファイルに焼き込まれた Claude 側のノート（差し替えで更新される）
       LOCAL … この端末で書いた分（localStorage。差し替えても消えない）
     表示は「SNAP に LOCAL を重ねたもの」。LOCAL が常に勝つ。
     ========================================================================= */

  const LS_KEY = "bokatech_local_v1";
  const LS_VIEW = "bokatech_view_v1";

  const SNAP = (function () {
    try { return JSON.parse(document.getElementById("snapshot").textContent); }
    catch (e) { return { built: "", notes: [] }; }
  })();

  function loadLocal() {
    try {
      const o = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (o && typeof o === "object") return { patch: o.patch || {}, mine: o.mine || {}, del: o.del || [] };
    } catch (e) {}
    return { patch: {}, mine: {}, del: [] };
  }
  let LOCAL = loadLocal();
  let saveFailed = false;
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(LOCAL)); saveFailed = false; }
    catch (e) { saveFailed = true; }
  }

  /* 棚と小分け。むんさんの言葉で */
  const SECS = {
    trouble: { name: "とらぶる", what: "過去に起きたトラブルと、その直し方",
      subs: [["cubase", "Cubase"], ["plugin", "プラグイン・音源"], ["pc", "PC・機材"], ["other", "そのほか"]] },
    song: { name: "がっきょく", what: "1曲ずつの制作メモ。機材・プラグイン・次にやること",
      subs: [["idea", "アイデア"], ["making", "制作中"], ["mix", "ミックス中"], ["done", "完成"], ["released", "公開済み"]] },
    tech: { name: "てくにっく", what: "作曲からミックスまでのコツ。思いつきは「むん」へ",
      subs: [["mun", "むん"], ["compose", "作曲"], ["arrange", "アレンジ"], ["midi", "打ち込み"], ["vocaloid", "調声"],
             ["sound", "音作り"], ["mix", "MIX"], ["master", "マスタリング"], ["cubase", "Cubase"]] }
  };
  const SEC_ORDER = ["song", "tech", "trouble"];
  const DIRS = { rock: "ボカロック・ポップス", edm: "EDM・ダンス", other: "そのほか" };
  const INSTS = [["general", "全体"], ["vocal", "ボーカル"], ["drums", "ドラム"], ["bass", "ベース"], ["synth", "シンセ・鍵盤"], ["guitar", "ギター"], ["strings", "ストリングス"]];
  const SRCK = { song: "今日の1曲", article: "記事・動画", memo: "" };
  const subName = (sec, k) => ((SECS[sec] || { subs: [] }).subs.find(s => s[0] === k) || [k, k || "未分類"])[1];
  const instName = k => (INSTS.find(i => i[0] === k) || [k, k])[1];

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const byNewest = (a, b) => String(b.added || "").localeCompare(String(a.added || "")) || String(a.id).localeCompare(String(b.id));

  /* ---------- SNAP と LOCAL を重ねる ---------- */
  let notes = [];
  function rebuild() {
    const del = new Set(LOCAL.del);
    const out = [];
    (SNAP.notes || []).forEach(raw => {
      if (del.has(raw.id)) return;
      const n = Object.assign({}, raw, LOCAL.patch[raw.id] || {});
      if (n.sec === "sample") { n.sec = "tech"; n.sub = "sound"; }
      if (n.sec && SECS[n.sec]) out.push(n);
    });
    Object.keys(LOCAL.mine).forEach(id => {
      if (del.has(id)) return;
      const n = Object.assign({ id: id }, LOCAL.mine[id]);
      n.mine = true;
      if (n.sec && SECS[n.sec]) out.push(n);
    });
    notes = out;
  }
  function patch(id, fields) {
    if (LOCAL.mine[id]) Object.assign(LOCAL.mine[id], fields);
    else LOCAL.patch[id] = Object.assign(LOCAL.patch[id] || {}, fields);
    saveLocal(); rebuild();
  }
  function removeNote(id) {
    if (LOCAL.mine[id]) delete LOCAL.mine[id];
    else { if (LOCAL.del.indexOf(id) < 0) LOCAL.del.push(id); delete LOCAL.patch[id]; }
    saveLocal(); rebuild();
  }

  let view = { name: "home", sec: null, sub: "all", id: null, flag: "all" };
  try { const v = JSON.parse(localStorage.getItem(LS_VIEW) || "null"); if (v && v.name !== "detail") view = Object.assign(view, v); } catch (e) {}
  const remember = () => { try { localStorage.setItem(LS_VIEW, JSON.stringify(view)); } catch (e) {} };

  let term = "", confirmDel = false, editingId = null;

  /* ---------- 共通の部品 ---------- */
  function itemCard(n) {
    const bits = [];
    if (n.checked === false) bits.push(`<span class="tag new">未確認</span>`);
    if (n.mine) bits.push(`<span class="tag mine">iPhone</span>`);
    if (n.sec === "trouble") bits.push(n.status === "open" ? `<span class="tag open">未解決</span>` : `<span class="tag ok">解決済み</span>`);
    bits.push(`<span class="tag k">${esc(subName(n.sec, n.sub))}</span>`);
    if (n.sec === "tech" && n.inst && n.inst !== "general") bits.push(`<span class="tag">${esc(instName(n.inst))}</span>`);
    if (n.src && SRCK[n.src.kind]) bits.push(`<span class="tag">${esc(SRCK[n.src.kind])}</span>`);
    if (n.star) bits.push(`<span class="tag star">★</span>`);
    if (n.sec === "tech" && n.done) bits.push(`<span class="tag ok">試した</span>`);
    if (n.sec === "song" && n.due) bits.push(`<span class="tag open">${esc(n.due)}</span>`);
    const sum = n.sec === "song"
      ? [n.bpm ? "BPM " + n.bpm : "", n.key, DIRS[n.dir], n.todo ? "次：" + n.todo : ""].filter(Boolean).join("　")
      : (n.body || n.fix || n.tip || "");
    return `<button type="button" class="item ${esc(n.sec)}${n.sec === "tech" && n.done ? " is-done" : ""}" data-open="${esc(n.id)}">
      <span class="t">${esc(n.title)}</span>
      ${sum ? `<span class="s">${esc(sum)}</span>` : ""}
      <span class="meta">${bits.join("")}<span class="d">${esc(n.added || "")}</span></span>
    </button>`;
  }
  function hit(n) {
    if (!term) return true;
    return [n.title, n.body, n.tip, n.fix, n.plugins, n.gear, n.voice, n.key, n.chords, n.mix, n.todo, n.due, (n.tags || []).join(" "), n.src && n.src.label, subName(n.sec, n.sub)]
      .join(" ").toLowerCase().includes(term);
  }

  /* ---------- 描画 ---------- */
  function render() {
    document.body.dataset.sec = view.sec || "";
    $("backBtn").hidden = view.name === "home";
    $("addBtn").hidden = false;
    const sec = view.sec ? SECS[view.sec] : null;

    if (view.name === "home") {
      $("crumb").innerHTML = `<p class="app">ぼかてっく<span>ノート</span></p><div class="path">${notes.length} 件のノート</div>`;
      $("q").placeholder = "ぜんぶから検索";
    } else if (view.name === "list") {
      $("crumb").innerHTML = `<p class="where">${esc(sec.name)}</p><div class="path">${esc(sec.what)}</div>`;
      $("q").placeholder = sec.name + " の中を検索";
    } else {
      $("crumb").innerHTML = `<p class="where">${esc(sec.name)}</p><div class="path">${esc(subName(view.sec, (notes.find(n => n.id === view.id) || {}).sub))}</div>`;
    }
    $("q").hidden = view.name === "detail";

    if (view.name === "list") {
      const inSec = notes.filter(n => n.sec === view.sec);
      const subs = [["all", "ぜんぶ"]].concat(sec.subs);
      $("subStrip").innerHTML = subs.map(s => {
        const c = s[0] === "all" ? inSec.length : inSec.filter(n => n.sub === s[0]).length;
        return `<button class="chip" type="button" data-sub="${s[0]}" aria-pressed="${view.sub === s[0]}">${esc(s[1])}<span class="n">${c}</span></button>`;
      }).join("");
      $("subStrip").hidden = false;
      const flags = view.sec === "trouble" ? [["open", "未解決だけ"], ["star", "★だけ"]] : view.sec === "song" ? [["active", "進行中だけ"], ["star", "★だけ"]] : [["unread", "未確認だけ"], ["star", "★だけ"], ["todo", "まだ試してない"]];
      $("flagStrip").innerHTML = flags.map(f => `<button class="chip mini" type="button" data-flag="${f[0]}" aria-pressed="${view.flag === f[0]}">${esc(f[1])}</button>`).join("");
      $("flagStrip").hidden = false;
    } else {
      $("subStrip").hidden = true; $("flagStrip").hidden = true;
    }

    const v = $("view");
    if (view.name === "home") v.innerHTML = homeHtml();
    else if (view.name === "list") v.innerHTML = listHtml();
    else v.innerHTML = detailHtml();

    $("status").textContent = saveFailed
      ? "この端末に保存できませんでした。プライベートブラウズを切るか、ホーム画面に追加して開いてください。"
      : "";
  }

  function homeHtml() {
    if (term) {
      const found = notes.filter(hit).sort(byNewest);
      return `<div class="home-h">検索結果　${found.length}</div>` +
        (found.length ? `<div class="list">${found.map(itemCard).join("")}</div>` : `<div class="empty"><b>見つかりませんでした</b>ほかの言葉で探してみてください。</div>`);
    }
    const shelf = k => {
      const s = SECS[k], ns = notes.filter(n => n.sec === k).sort(byNewest);
      const open = k === "trouble" ? ns.filter(n => n.status === "open").length : 0;
      const active = k === "song" ? ns.filter(n => ["idea", "making", "mix"].includes(n.sub)).length : 0;
      const unread = ns.filter(n => n.checked === false).length;
      return `<button type="button" class="shelf ${k}" data-sec="${k}">
        <h2>${esc(s.name)}</h2><span class="cnt">${ns.length}<small>件</small></span>
        <p class="what">${esc(s.what)}</p>
        ${open ? `<span class="alert">未解決 ${open} 件</span>` : ""}
        ${active ? `<span class="alert" style="color:var(--c)">進行中 ${active} 曲</span>` : ""}
        ${unread ? `<span class="alert" style="color:var(--c)">未確認 ${unread} 件</span>` : ""}
        ${ns.length ? `<span class="latest">${ns.slice(0, 2).map(n => `<span>${esc(n.title)}</span>`).join("")}</span>` : ""}
      </button>`;
    };
    const fresh = notes.filter(n => n.checked === false).sort(byNewest);
    const mun = notes.filter(n => n.sec === "tech" && n.sub === "mun").sort(byNewest).slice(0, 3);
    let html = fresh.length ? `<div class="home-h">未確認　${fresh.length}（開くと確認済みになります）</div><div class="list" style="margin-bottom:22px">${fresh.map(itemCard).join("")}</div>` : "";
    html += `<div class="shelves">${SEC_ORDER.map(shelf).join("")}</div>`;
    if (mun.length) html += `<div class="home-h">むんのメモ</div><div class="list">${mun.map(itemCard).join("")}</div>`;
    html += syncHtml();
    return html;
  }

  function syncHtml() {
    const mineN = Object.keys(LOCAL.mine).length;
    const patchN = Object.keys(LOCAL.patch).length;
    const delN = LOCAL.del.length;
    return `<div class="syncbox" id="syncbox">
      <h3>この端末で書いた分</h3>
      <p>このページは Claude 側のノートを写したものです。<b>ここで書いた分はこの iPhone の中だけ</b>に残り、HTML を新しいものに差し替えても消えません。</p>
      <div class="nums">焼き込み ${(SNAP.notes || []).length} 件（${esc(SNAP.built || "日付不明")}時点）　／　この端末：新規 ${mineN}・手直し ${patchN}・消した ${delN}</div>
      <div class="btns">
        <button class="btn" type="button" data-sync="copy">書いた分をコピー</button>
        <button class="btn" type="button" data-sync="file">ファイルに書き出す</button>
        <button class="btn" type="button" data-sync="show">中身を見る</button>
      </div>
      <p class="ok" id="syncOk"></p>
      <textarea id="syncOut" hidden readonly></textarea>
      <p>コピーしたものを Claude のチャットに貼れば、Claude 側のノートに取り込めます。取り込んでもこの端末の分は消しません。</p>
    </div>`;
  }

  function listHtml() {
    let ns = notes.filter(n => n.sec === view.sec);
    if (view.sub !== "all") ns = ns.filter(n => n.sub === view.sub);
    if (view.flag === "star") ns = ns.filter(n => n.star);
    if (view.flag === "todo") ns = ns.filter(n => !n.done);
    if (view.flag === "open") ns = ns.filter(n => n.status === "open");
    if (view.flag === "unread") ns = ns.filter(n => n.checked === false);
    if (view.flag === "active") ns = ns.filter(n => ["idea", "making", "mix"].includes(n.sub));
    ns = ns.filter(hit).sort(byNewest);
    if (!ns.length) {
      const empty = view.sec === "song" && !term && view.flag === "all" && view.sub === "all"
        ? `<b>まだ曲がありません</b>「＋ 書く」から1曲目を足せます。曲名だけでも保存できます。`
        : view.sub === "mun" && !term && view.flag === "all"
        ? `<b>むんのメモはまだ空です</b>思いついたことを「＋ 書く」から残しておけます。タイトルだけでも保存できます。`
        : `<b>ここにはまだ何もありません</b>${term || view.flag !== "all" ? "検索語か絞り込みを変えてみてください。" : "「＋ 書く」から足せます。"}`;
      return `<div class="empty">${empty}</div>`;
    }
    return `<div class="list">${ns.map(itemCard).join("")}</div>`;
  }

  function detailHtml() {
    const n = notes.find(x => x.id === view.id);
    if (!n) return `<div class="empty"><b>このノートは見つかりませんでした</b>消されたか、まだ読み込み中です。</div>`;
    const src = n.src || {}, url = safeUrl(src.url);
    const tags = [];
    if (n.mine) tags.push(`<span class="tag mine">iPhone で書いた</span>`);
    if (n.sec === "trouble") tags.push(n.status === "open" ? `<span class="tag open">未解決</span>` : `<span class="tag ok">解決済み</span>`);
    tags.push(`<span class="tag k">${esc(subName(n.sec, n.sub))}</span>`);
    if (n.sec === "tech" && n.inst && n.inst !== "general") tags.push(`<span class="tag">${esc(instName(n.inst))}</span>`);
    (n.tags || []).forEach(t => tags.push(`<span class="tag">${esc(t)}</span>`));
    const B = (cls, lab, txt) => txt ? `<div class="block ${cls}"><span class="lab">${lab}</span><div class="txt">${esc(txt)}</div></div>` : "";
    let from = "";
    if ((src.label || url) && n.sec !== "trouble") {
      const kind = SRCK[src.kind] ? esc(SRCK[src.kind]) + "　" : "";
      from = `<div class="block"><span class="lab">出どころ</span><div class="txt">${kind}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(src.label || url)}</a>` : esc(src.label)}</div></div>`;
    }
    const tr = n.sec === "trouble";
    if (n.sec === "song") return songDetail(n, tags, B);
    const acts = `<div class="actions">
      ${tr ? `<button class="act done" type="button" data-act="status" aria-pressed="${n.status !== "open"}">${n.status === "open" ? "解決した" : "✓ 解決済み"}</button>`
           : `<button class="act done" type="button" data-act="done" aria-pressed="${!!n.done}">${n.done ? "✓ 試した" : "試した？"}</button>`}
      <button class="act star" type="button" data-act="star" aria-pressed="${!!n.star}">${n.star ? "★ お気に入り" : "☆ お気に入り"}</button>
      ${confirmDel
        ? `<button class="act push" type="button" data-act="nodel">やめる</button><button class="act warn" type="button" data-act="del">本当に消す</button>`
        : `<button class="act push" type="button" data-act="edit">直す</button><button class="act" type="button" data-act="ask">消す</button>`}
    </div>`;
    return `<article class="detail">
      <div class="meta">${tags.join("")}<span class="d">${esc(n.added || "")}</span></div>
      <h2>${esc(n.title)}</h2>
      ${B("", tr ? "何が起きたか" : "内容", n.body)}
      ${tr ? B("fix", "直し方", n.fix) : B("try", "やってみる", n.tip)}
      ${from}
      ${acts}
    </article>`;
  }

  function songDetail(n, tags, B) {
    const F = (lab, v) => v ? `<div class="fact"><span class="lab">${lab}</span><span class="v">${esc(v)}</span></div>` : "";
    const facts = [F("BPM", n.bpm), F("キー", n.key), F("方向", DIRS[n.dir]), F("歌声", n.voice), F("締切・応募先", n.due)].join("");
    const order = SECS.song.subs.map(x => x[0]);
    const next = order[order.indexOf(n.sub) + 1];
    const acts = `<div class="actions">
      ${next ? `<button class="act" type="button" data-act="nextstage" data-next="${next}">→ ${esc(subName("song", next))}にする</button>` : ""}
      <button class="act star" type="button" data-act="star" aria-pressed="${!!n.star}">${n.star ? "★" : "☆"}</button>
      ${confirmDel
        ? `<button class="act push" type="button" data-act="nodel">やめる</button><button class="act warn" type="button" data-act="del">本当に消す</button>`
        : `<button class="act push" type="button" data-act="edit">直す</button><button class="act" type="button" data-act="ask">消す</button>`}
    </div>`;
    return `<article class="detail">
      <div class="meta">${tags.join("")}<span class="d">${esc(n.added || "")}</span></div>
      <h2>${esc(n.title)}</h2>
      ${facts ? `<div class="facts">${facts}</div>` : ""}
      ${B("todo", "次にやること", n.todo)}
      ${B("", "コード進行・構成", n.chords)}
      ${B("", "使用機材", n.gear)}
      ${B("", "プラグイン・音源", n.plugins)}
      ${B("", "ミックス・音作りのメモ", n.mix)}
      ${B("", "メモ", n.body)}
      ${acts}
    </article>`;
  }

  /* ---------- 移動 ---------- */
  function go(next) { view = Object.assign(view, next); confirmDel = false; remember(); render(); window.scrollTo(0, 0); }
  $("backBtn").addEventListener("click", () => {
    if (view.name === "detail") go({ name: view.sec ? "list" : "home", id: null });
    else go({ name: "home", sec: null, sub: "all", flag: "all" });
    term = ""; $("q").value = ""; render();
  });
  $("q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });

  /* ---------- 書き出し ---------- */
  function exportPayload() {
    return JSON.stringify({
      app: "bokatech-note",
      from: "iphone",
      at: new Date().toISOString(),
      base: SNAP.built || "",
      mine: LOCAL.mine,
      patch: LOCAL.patch,
      del: LOCAL.del
    }, null, 1);
  }

  document.addEventListener("click", async e => {
    const b = e.target.closest("button");
    if (!b) return;

    if (b.dataset.sync) {
      const out = $("syncOut"), ok = $("syncOk"), text = exportPayload();
      if (b.dataset.sync === "show") { out.hidden = !out.hidden; out.value = text; return; }
      if (b.dataset.sync === "copy") {
        try { await navigator.clipboard.writeText(text); ok.textContent = "コピーしました。Claude のチャットに貼ってください。"; }
        catch (err) { out.hidden = false; out.value = text; out.select(); ok.textContent = "自動コピーできませんでした。下の枠を長押しして全部コピーしてください。"; }
        return;
      }
      if (b.dataset.sync === "file") {
        try {
          const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
          const a = document.createElement("a");
          a.href = url; a.download = "bokatech-iphone-" + today() + ".json";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          ok.textContent = "書き出しました。";
        } catch (err) { out.hidden = false; out.value = text; ok.textContent = "書き出せませんでした。下の枠からコピーしてください。"; }
        return;
      }
    }

    if (b.dataset.sec && b.classList.contains("shelf")) { term = ""; $("q").value = ""; go({ name: "list", sec: b.dataset.sec, sub: "all", flag: "all" }); return; }
    if (b.dataset.sub) { go({ sub: b.dataset.sub }); return; }
    if (b.dataset.flag) { go({ flag: view.flag === b.dataset.flag ? "all" : b.dataset.flag }); return; }
    if (b.dataset.open) {
      const n = notes.find(x => x.id === b.dataset.open);
      if (n) {
        if (n.checked === false) patch(n.id, { checked: true });
        go({ name: "detail", sec: n.sec, id: n.id });
      }
      return;
    }
    const act = b.dataset.act;
    if (!act) return;
    const n = notes.find(x => x.id === view.id);
    if (!n) return;
    if (act === "done") patch(n.id, { done: !n.done });
    else if (act === "star") patch(n.id, { star: !n.star });
    else if (act === "status") patch(n.id, { status: n.status === "open" ? "solved" : "open" });
    else if (act === "nextstage") patch(n.id, { sub: b.dataset.next });
    else if (act === "edit") { openSheet(n); return; }
    else if (act === "ask") { confirmDel = true; render(); return; }
    else if (act === "nodel") { confirmDel = false; render(); return; }
    else if (act === "del") { const s = n.sec; removeNote(n.id); go({ name: "list", sec: s, id: null }); return; }
    render();
  });

  /* ---------- 書くシート ---------- */
  let sheetSec = "tech";
  $("fInst").innerHTML = INSTS.map(i => `<option value="${i[0]}">${esc(i[1])}</option>`).join("");

  function shapeSheet(sec) {
    sheetSec = sec;
    document.body.dataset.sec = sec;
    const s = SECS[sec];
    $("fSub").innerHTML = s.subs.map(x => `<option value="${x[0]}">${esc(x[1])}</option>`).join("");
    const tr = sec === "trouble";
    const sg = sec === "song";
    $("lTitle").textContent = tr ? "何が起きた？（ひとことで）" : sg ? "曲名（仮タイトルでOK）" : "タイトル";
    $("lBody").textContent = tr ? "くわしい状況" : sg ? "メモ" : "内容";
    $("lSub").textContent = sg ? "いまの段階" : "小分け";
    $("wSong").hidden = !sg;
    $("wFix").hidden = !tr; $("wStatus").hidden = !tr;
    $("wTip").hidden = tr || sg;
    $("wInstTags").hidden = sec !== "tech";
    $("wSrc").hidden = tr || sg;
  }
  function openSheet(n) {
    editingId = n ? n.id : null;
    let sec = n ? n.sec : (view.sec || "tech");
    let sub = n ? n.sub : (view.sub !== "all" ? view.sub : (sec === "tech" ? "mun" : sec === "song" ? "making" : SECS[sec].subs[0][0]));
    shapeSheet(sec);
    $("sheetTitle").textContent = (n ? "直す：" : "書く：") + SECS[sec].name;
    $("fSub").value = sub;
    $("fTitle").value = n ? n.title || "" : "";
    $("fBody").value = n ? n.body || "" : "";
    $("fFix").value = n ? n.fix || "" : "";
    $("fStatus").value = n && n.status === "open" ? "open" : "solved";
    $("fTip").value = n ? n.tip || "" : "";
    $("fInst").value = n && n.inst ? n.inst : "general";
    $("fTags").value = n ? (n.tags || []).join("、") : "";
    $("fSrcLabel").value = n && n.src ? n.src.label || "" : "";
    $("fSrcUrl").value = n && n.src ? n.src.url || "" : "";
    const sv = (id, k, d) => { $(id).value = n && n[k] != null ? n[k] : (d || ""); };
    sv("sDir", "dir", "rock"); sv("sVoice", "voice"); sv("sBpm", "bpm"); sv("sKey", "key"); sv("sChords", "chords");
    sv("sGear", "gear"); sv("sPlugins", "plugins"); sv("sMix", "mix"); sv("sTodo", "todo"); sv("sDue", "due");
    $("formErr").textContent = "";
    $("sheetBack").hidden = false;
    setTimeout(() => $("fTitle").focus(), 30);
  }
  function closeSheet() { $("sheetBack").hidden = true; editingId = null; document.body.dataset.sec = view.sec || ""; }
  $("addBtn").addEventListener("click", () => openSheet(null));
  $("cancelBtn").addEventListener("click", closeSheet);
  $("sheetBack").addEventListener("click", e => { if (e.target === $("sheetBack")) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheetBack").hidden) closeSheet(); });

  $("sheet").addEventListener("submit", e => {
    e.preventDefault();
    const title = $("fTitle").value.trim();
    if (!title) { $("formErr").textContent = "タイトルを入れてください。"; return; }
    const url = $("fSrcUrl").value.trim();
    if (url && !safeUrl(url)) { $("formErr").textContent = "リンクは https:// から始まる形で入れてください。"; return; }
    const old = editingId ? notes.find(x => x.id === editingId) : null;
    const sec = sheetSec, sub = $("fSub").value;
    const doc = {
      sec, sub, title,
      body: $("fBody").value.trim(),
      tags: sec === "tech" ? $("fTags").value.split(/[、,，]/).map(s => s.trim()).filter(Boolean).slice(0, 8) : (old && old.tags) || [],
      added: old && old.added ? old.added : today(),
      star: old ? !!old.star : false,
      checked: true
    };
    if (sec === "trouble") { doc.fix = $("fFix").value.trim(); doc.status = $("fStatus").value; }
    else if (sec === "song") {
      ["dir", "voice", "bpm", "key", "chords", "gear", "plugins", "mix", "todo", "due"].forEach(k => {
        doc[k] = $("s" + k[0].toUpperCase() + k.slice(1)).value.trim();
      });
    } else {
      doc.tip = $("fTip").value.trim();
      doc.done = old ? !!old.done : false;
      doc.src = { kind: old && old.src && old.src.kind ? old.src.kind : "memo", label: $("fSrcLabel").value.trim(), url };
    }
    if (sec === "tech") doc.inst = $("fInst").value;

    if (editingId) {
      patch(editingId, doc);
      closeSheet(); render();
    } else {
      const id = "ip-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 6);
      LOCAL.mine[id] = doc;
      saveLocal(); rebuild();
      closeSheet();
      go({ name: "detail", sec, id });
    }
  });

  /* ---------- 起動 ---------- */
  rebuild();
  render();
})();
</script>
</body>
</html>
